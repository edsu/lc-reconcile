[project]
name = "lc-reconcile"
version = "0.1.0"
description = "Reconcile headings against a local, self-updating index of id.loc.gov authorities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "reconciliation",
    "openrefine",
    "id.loc.gov",
    "lcnaf",
    "lcsh",
    "lcgft",
    "mads",
    "libraries",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The library and the command line need nothing beyond the standard library;
# only the web service has dependencies, and they sit behind the extra.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]

[project.scripts]
lc-reconcile = "lc_reconcile.cli:main"

[project.urls]
Homepage = "https://github.com/edsu/lc-reconcile"
Issues = "https://github.com/edsu/lc-reconcile/issues"

[dependency-groups]
dev = [
    # The web service's tests need its extra, and its TestClient httpx2.
    "lc-reconcile[server]",
    "httpx2>=2.14.0",
    # And its schema test validates responses against the spec's schemas.
    "jsonschema>=4.23",
    "pytest>=8.3.4",
    # Only the tests use rdflib: they check the records reader against it.
    "rdflib>=7.1.3",
    "ruff>=0.9.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_reconcile"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-v -m 'not live'"
markers = [
    "network: may reach the network, so the offline guard stands aside",
    "live: talks to the live id.loc.gov, deselected by default",
]

[tool.ty.environment]
# The benchmark scripts are run as bench/NAME.py, with bench/ on the path,
# and import each other as such.
extra-paths = ["bench"]
